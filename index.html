<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campeão de Segurança</title>

<!-- biblioteca excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

h1{margin-top:20px;}

button{
  padding:12px 18px;
  border:none;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
  font-weight:bold;
}

.primary{background:white;color:black;}
.secondary{background:#22c55e;color:black;}
.ghost{background:#475569;color:white;}

.module{display:none;margin-top:20px;}
.module.active{display:block;}

.correct-effect{
  animation:acerto 0.4s;
}

@keyframes acerto{
  50%{background:#22c55e;color:white;transform:scale(1.1);}
}

.wrong-effect{
  animation:erro 0.4s;
}

@keyframes erro{
  25%{transform:translateX(-5px);}
  50%{transform:translateX(5px);background:#ef4444;}
}

.ranking{
  margin-top:20px;
}

input{
  padding:10px;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<h1>🏆 Campeão de Segurança</h1>

<img src="mascotes-campeao.png" width="200">

<div style="margin-top:15px;">
<input id="player-name" placeholder="Digite seu nome">
</div>

<div>
<button class="primary" onclick="openModule('quiz')">Quiz</button>
<button class="secondary" onclick="baixarExcel()">Excel</button>
<button class="ghost" onclick="gerarCertificados()">Certificados</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="module active">
<h2>Pergunta</h2>
<div id="question"></div>
<div id="answers"></div>
<h3 id="score">0</h3>
</div>

<!-- RANKING -->
<div class="ranking" id="ranking"></div>

<script>
let ranking = JSON.parse(localStorage.getItem('rankingRenaux')) || [];

const quiz = [
{q:"EPI é obrigatório?",a:["Sim","Não"],c:0},
{q:"Atalho é seguro?",a:["Sim","Não"],c:1}
];

let index=0;
let score=0;

function openModule(id){
document.querySelectorAll('.module').forEach(m=>m.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function render(){
document.getElementById("question").innerText=quiz[index].q;
let html="";
quiz[index].a.forEach((a,i)=>{
html+=`<button onclick="answer(${i},this)">${a}</button>`;
});
document.getElementById("answers").innerHTML=html;
}

function answer(i,btn){
if(i===quiz[index].c){
score+=10;
btn.classList.add("correct-effect");
}else{
btn.classList.add("wrong-effect");
}
document.getElementById("score").innerText=score;

setTimeout(()=>{
index++;
if(index>=quiz.length){
salvar(score);
index=0;
score=0;
}
render();
},800);
}

function salvar(pontos){
const nome=document.getElementById("player-name").value || "Sem nome";
ranking.push({nome,pontos});
ranking.sort((a,b)=>b.pontos-a.pontos);
localStorage.setItem("rankingRenaux",JSON.stringify(ranking));
mostrarRanking();
}

function mostrarRanking(){
let html="<h2>Ranking</h2>";
ranking.forEach((r,i)=>{
html+=`<div>${i+1}º - ${r.nome} (${r.pontos})</div>`;
});
document.getElementById("ranking").innerHTML=html;
}

function baixarExcel(){
const dados=ranking.map((r,i)=>({
Posicao:i+1,
Nome:r.nome,
Pontos:r.pontos
}));
const wb=XLSX.utils.book_new();
const ws=XLSX.utils.json_to_sheet(dados);
XLSX.utils.book_append_sheet(wb,ws,"Ranking");
XLSX.writeFile(wb,"ranking.xlsx");
}

function gerarCertificados(){
ranking.forEach(r=>{
let w=window.open();
w.document.write(`
<h1>Certificado</h1>
<img src="logo-renaux.png" width="150">
<img src="mascotes-campeao.png" width="150">
<p>Certificamos que <b>${r.nome}</b></p>
<p>Pontuação: ${r.pontos}</p>
`);
});
}

render();
mostrarRanking();
</script>

</body>
</html>
