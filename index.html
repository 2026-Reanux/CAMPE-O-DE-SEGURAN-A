<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campeão da Segurança</title>

<style>
body{
font-family:Arial;
background:#eef5fb;
margin:0;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

h1{
color:#0b2e59;
}

.card{
background:white;
padding:20px;
border-radius:15px;
margin-top:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

button{
padding:12px;
margin-top:10px;
width:100%;
border-radius:10px;
border:none;
background:#0b2e59;
color:white;
font-weight:bold;
cursor:pointer;
}

input{
padding:10px;
width:100%;
border-radius:10px;
border:1px solid #ccc;
}

.hidden{display:none;}

.correct{background:#c8f7c5;}
.wrong{background:#f7c5c5;}

</style>
</head>

<body>

<div class="container">

<h1>🏆 Campeão da Segurança</h1>

<div class="card">
<input id="nome" placeholder="Digite seu nome">
<button onclick="iniciar()">Iniciar</button>
</div>

<div id="game" class="card hidden">
<h3 id="faseTitulo"></h3>
<p id="pergunta"></p>

<div id="opcoes"></div>

<p id="feedback"></p>

<button onclick="proxima()">Próxima</button>
</div>

<div id="final" class="card hidden">
<h2>Resultado Final</h2>
<p id="pontuacao"></p>
<button onclick="enviar()">Enviar Ranking</button>
</div>

<div class="card">
<h3>Área Admin</h3>
<input id="senha" placeholder="Senha">
<button onclick="admin()">Entrar</button>
<div id="ranking"></div>
</div>

</div>

<script>
https://script.google.com/macros/s/AKfycbyvYm2PsTUeGDXbWx1wm0RgVhrHE2l4BKCEzAmea1NEaUEeiejXf106Hi3hL7SMXqdB0A/exec

let nome="";
let pontos=0;
let fase=0;
let perguntaAtual=0;

const fases = [

{
titulo:"Fase 1 - Empilhadeira",
perguntas:[
{
pergunta:"Pedestre cruzando rota da empilhadeira. O que fazer?",
opcoes:[
{texto:"Parar e garantir segurança", correta:true},
{texto:"Continuar operação", correta:false}
]
}
]
},

{
titulo:"Fase 2 - Prensa",
perguntas:[
{
pergunta:"Proteção removida da máquina. Qual ação?",
opcoes:[
{texto:"Parar operação", correta:true},
{texto:"Continuar produção", correta:false}
]
}
]
},

{
titulo:"Fase 3 - Comportamento Seguro",
perguntas:[
{
pergunta:"Uso de celular em área operacional?",
opcoes:[
{texto:"Interromper e orientar", correta:true},
{texto:"Ignorar", correta:false}
]
}
]
}

];

function iniciar(){
nome=document.getElementById("nome").value;
if(!nome){alert("Digite o nome");return;}

document.getElementById("game").classList.remove("hidden");
mostrarPergunta();
}

function mostrarPergunta(){
let f=fases[fase];
let p=f.perguntas[perguntaAtual];

document.getElementById("faseTitulo").innerText=f.titulo;
document.getElementById("pergunta").innerText=p.pergunta;

let html="";
p.opcoes.forEach((op,i)=>{
html+=`<button onclick="responder(${op.correta})">${op.texto}</button>`;
});

document.getElementById("opcoes").innerHTML=html;
}

function responder(correta){
if(correta){
pontos+=10;
document.getElementById("feedback").innerText="✔ Correto!";
}else{
document.getElementById("feedback").innerText="❌ Errado!";
}
}

function proxima(){
fase++;
if(fase>=fases.length){
finalizar();
}else{
mostrarPergunta();
}
}

function finalizar(){
document.getElementById("game").classList.add("hidden");
document.getElementById("final").classList.remove("hidden");
document.getElementById("pontuacao").innerText="Pontuação: "+pontos;
}

async function enviar(){
await fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"saveScore",
nome:nome,
pontuacao:pontos,
acertos:pontos/10
})
});
alert("Enviado com sucesso!");
}

async function admin(){
let senha=document.getElementById("senha").value;

let res=await fetch(API_URL+"?action=adminRanking&password="+senha);
let data=await res.json();

if(!data.ok){
alert("Senha inválida");
return;
}

let html="<h4>Ranking</h4>";

data.ranking.forEach((r,i)=>{
html+=`${i+1} - ${r.nome} (${r.pontuacao})<br>`;
});

document.getElementById("ranking").innerHTML=html;
}

</script>

</body>
</html>
